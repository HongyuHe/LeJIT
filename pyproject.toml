[project]
name = "lejit"
version = "0.1.0"
description = "Constraint-aware tabular generation with Hugging Face language models and NetNomos rules"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.1.0",
  "datasets>=2.20.0",
  "netnomos",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "pydantic>=2.11.0",
  "rich>=14.2.0",
  "tomli-w>=1.0.0",
  "torch>=2.2.0",
  "transformers>=4.46.0",
  "tqdm>=4.67.1",
  "z3-solver>=4.15.3.0",
]

[project.scripts]
lejit = "lejit.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lejit"]

[tool.uv]
package = true

[tool.uv.sources]
netnomos = { path = "../NetNomos", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
