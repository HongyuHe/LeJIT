[dataset]
dataset_spec = "../../data/specs/metadc.json"
input_path = "../../data/metadc_test_10racks_5ctx.csv"
rules_path = "../../rules/golden_metadc/rules.json"

[model]
mode = "config"
architecture = "gpt2"

[model.config_overrides]
n_positions = 512
n_ctx = 512
n_embd = 256
n_layer = 6
n_head = 8

[serialization]
numeric_precision = 6
max_categorical_domain = 50000

[training]
epochs = 3
batch_size = 16
learning_rate = 0.0005
seed = 42

[decoding]
temperature = 1.0
do_sample = true
top_p = 0.95

[run]
n_samples = 100
batch_size = 1
samples_per_prompt = 1
